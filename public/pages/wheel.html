  <script>
    const socket = io()
    socket.on('data', data => {
      $(`#wheel1, #wheel2, #wheel3, #wheel4, #wheel5, #bonusContainer`).css('opacity', '0')
      $('#obm300,#obm700').attr('src', '../gpx/Ô bí mật.png')
      if (data.currentRound == 'bonus') {
        $(`#bonusContainer`).css('opacity', '1')
      }
      else $(`#wheel${data.currentRound}`).css('opacity', '1')

      document.getElementById('wheelContainer').style.transform = 'rotate(' + data.currentRotation + 'deg)';
      data.wedgesStatus && Object.entries(data.wedgesStatus).forEach(([wedge, status]) => {
        if (status) {
          $('#' + wedge).css('opacity', '1')
        }
        else {
          $('#' + wedge).css('opacity', '0')
        }
      })
    })
    function spin(deg, time, wheel) {
      if (wheel == 'bonus') {
        document.getElementById('bonusWheel').style.transition = 'transform ' + time + 's cubic-bezier(0.2, 0, 0, 1)'
        document.getElementById('bonusWheel').style.transform = 'rotate(' + deg + 'deg)';
        return
      }
      else {
        document.getElementById('wheelContainer').style.transition = 'transform ' + time + 's cubic-bezier(0.3, 0, 0.6, 1)'
        document.getElementById('wheelContainer').style.transform = 'rotate(' + deg + 'deg)';
      }
    }

    let indicatePlayerInterval
    function indicatePlayer(player) {
      clearInterval(indicatePlayerInterval)
      $('#redPlayer').css('opacity', '0')
      $('#yellowPlayer').css('opacity', '0')
      $('#bluePlayer').css('opacity', '0')
      $('#kims').css('opacity', '1')
      if (player == 1) {
        indicatePlayerInterval = setInterval(() => {
          $('#redPlayer').css('opacity', $('#redPlayer').css('opacity') == 1 ? 0 : 1)
          $('#kims').css('opacity', $('#kims').css('opacity') == 1 ? 0 : 1)
        }, 500);
        $('#yellowPlayer').css('opacity', '0')
        $('#bluePlayer').css('opacity', '0')
        $('#kims').css('opacity', '1')
      }
      else if (player == 2) {
        indicatePlayerInterval = setInterval(() => {
          $('#yellowPlayer').css('opacity', $('#yellowPlayer').css('opacity') == 1 ? 0 : 1)
          $('#kims').css('opacity', $('#kims').css('opacity') == 1 ? 0 : 1)
        }, 500);
        $('#redPlayer').css('opacity', '0')
        $('#bluePlayer').css('opacity', '0')
        $('#kims').css('opacity', '1')
      }
      else if (player == 3) {
        indicatePlayerInterval = setInterval(() => {
          $('#bluePlayer').css('opacity', $('#bluePlayer').css('opacity') == 1 ? 0 : 1)
          $('#kims').css('opacity', $('#kims').css('opacity') == 1 ? 0 : 1)
        }, 500);
        $('#redPlayer').css('opacity', '0')
        $('#yellowPlayer').css('opacity', '0')
        $('#kims').css('opacity', '1')
      }
    }

    socket.on('spinWheel', (deg, time) => {
      spin(deg, time, 'main')
    })
    socket.on('spinBonusWheel', (deg, time) => {
      spin(deg, time, 'bonus')
    })
    socket.on('indicatePlayer', (player) => {
      indicatePlayer(player)
    })
    socket.on('showWheel', round => {
      $(`#wheel1, #wheel2, #wheel3, #wheel4, #wheel5, #bonusContainer`).css('opacity', '0')
      $('#obm300,#obm700').attr('src', '../gpx/Ô bí mật.png')
      if (round == 'bonus') {
        $(`#bonusContainer`).css('opacity', '1')
      }
      else $(`#wheel${round}`).css('opacity', '1')
    })

    socket.on('toggleWedge', (wedge, status) => {
      if (status) {
        $('#' + wedge).css('opacity', '1')
      }
      else {
        $('#' + wedge).css('opacity', '0')
      }
    })

    socket.on('revealPrize', (prizeIndex, prize) => {
      $(`#ptArea>div:nth-child(${prizeIndex})>.ptMini`).attr('src', '../gpx/' + prize + '.png')
    })
    socket.on('hidePrizePrizes', () => {
      $('#ptArea>div>.ptMini').attr('src', '../gpx/Phần thưởng.png')
    })
    socket.on('showPrizePanel', () => {
      $('#ptArea').animate({ scale: 1 }, { duration: 750 })
    })
    socket.on('hidePrizePanel', () => {
      $('#ptArea').animate({ scale: 0 }, { duration: 750 })
    })

    socket.on('revealMysteryPrize', (position, prize) => {
      if (prize == 'MĐ') {
        if (position == '700') {
          $('#obm700').attr('src', '../gpx/Ô bí mật (Mất điểm).png')
        }
        else if (position == '300') {
          $('#obm300').attr('src', '../gpx/Ô bí mật (Mất điểm).png')
        }
      }
      else if (prize == '10k') {
        if (position == '700') {
          $('#obm700').attr('src', '../gpx/GL 10000.png')
        }
        else if (position == '300') {
          $('#obm300').attr('src', '../gpx/GL 10000.png')
        }
      }
    })
    socket.on('showEnvelope', () => {
      $('#bonusTopFace,#bonusFrontFace,#bonusBotFace').css('opacity', 1)
    })
    socket.on('closeEnvelope', () => {
      $('#bonusTopFace').css({ transform: 'rotateX(90deg)' })
      setTimeout(() => {
        $('#bonusFrontFace').css({ transform: 'rotateX(0deg)' })
      }, 500);
    })
    socket.on('hideEnvelope', () => {
      $('#bonusTopFace,#bonusFrontFace,#bonusBotFace').css('opacity', 0)
    })
    socket.on('revealBonusPrize', (prize) => {
      $('#bonusFrontFace').css({ transform: 'rotateX(90deg)' })
      setTimeout(() => {
        $('#bonusTopFace').css({ transform: 'rotateX(0deg)' })
      }, 500);
      $('#bonusBotFace').attr('src', '../gpx/' + prize + 'kgl.png')
    })
  </script>
