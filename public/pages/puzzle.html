  <style>
    * {
      -webkit-user-select: none;
      /* Safari */
      -ms-user-select: none;
      /* IE 10 and IE 11 */
      user-select: none;
      /* Standard syntax */
      pointer-events: none;
    }

    @font-face {
      font-family: "helve";
      src: url("../gpx/helveticaneuecondensedblack.ttf");
    }

    @font-face {
      font-family: lufga;
      src: url("../gpx/Fz\ Lufga\ Bold.ttf");
    }

    body {
      background-color: white;
      margin: 0;
      overflow: hidden;
    }

    p {
      font-family: 'helve';
      font-size: 68pt;
      text-align: center;
      margin: 11px 0px;
    }

    #board {
      position: absolute;
      display: grid;
      grid-template-columns: repeat(14, 1fr);
      grid-template-rows: repeat(4, 1fr);
      left: 151px;
      top: 253px;
      gap: 8px;
    }

    .letter {
      background-image: url('../gpx/ô chữ.png');
      background-size: contain;
      background-repeat: no-repeat;
      width: 108.1px;
      height: 129px;
    }

    .letter.hasLetter {
      background-image: url('../gpx/ô chữ hiện.png');
    }

    .letter.waitToOpen {
      background-image: url('../gpx/chữ cái được gọi.png');
    }

    .letter.giaima {
      background-image: url('../gpx/ô giải mã.png');
    }

    #p1Score,
    #p2Score,
    #p3Score {
      font-size: 60pt;
      color: white;
      text-shadow: 2px 2px black;
    }

    #p1Name,
    #p2Name,
    #p3Name {
      font-size: 20pt;
      color: white;
      text-shadow: 2px 2px black;
    }

    .flexcon {
      display: flex;
      width: 1920px;
      position: relative;
    }

    .flexcon>* {
      width: 100%;
      text-align: center;
    }

    $(function () {
      for (let i = 0; i <= 55; i++) {
        if (i == 0 || i == 13 || i == 42 || i == 55) $('#board').append('<div class="letter" id="letter' + i + '" style="opacity:0;"><p></p></div>');
        else {
          $('#board').append('<div class="letter" id="letter' + i + '"><p></p></div>');
        }
      }
    })

    let vol = .2
    let repeatedSounds = ['../sounds/toss up 1.mp3', '../sounds/toss up 2.mp3', '../sounds/toss up 3.mp3', '../sounds/nhac sieu toc.mp3', '../sounds/nhacmoptobm.mp3', '../sounds/speed up.mp3', '../sounds/3c1v.mp3']
    function playSound(url, vol) {
      const sound = new Howl({
        src: [url],
        volume: vol,
        loop: repeatedSounds.includes(url) ? true : false
      });
      sounds.push(sound)
      sound.play();
    }
    function stopAllSounds() {
      for (let sound of sounds) {
        sound.stop()
      }
      sounds = []
    }
    let sounds = []
    socket.on('playSound', url => {
      playSound(url, vol)
    })
    socket.on('stopAllSounds', () => {
      stopAllSounds()
    })

    function digitGroup(dInput) {
      let output = "";
      for (let i = String(dInput).length - 1; i > -1; i--) {
        output = String(dInput).charAt(i) + output;
        let cnt = String(dInput).length - i;
        if (cnt % 3 === 0 && i !== 0) output = "." + output;
      }
      return output;
    }

    function showCategory(catType, category) {
      $('#catContainer').css('opacity', '1')
      if (catType == 'hide') {
        $('#catContainer').animate({
          top: '240px'
        }, 500, 'swing', () => {
          $('#catContainer').css('opacity', '0')
        })
        $('#uplight').stop().css({
          'opacity': 1, 'left': '393px'
        })
        $('#downlight').stop().css({
          'opacity': 1, 'left': '1353px'
        })
      }
      else {
        if (catType == 'normal') {
          $('#normal').css('opacity', '0')
          $('#giaima').css('opacity', '0')
          $('#tunghoanh').css('opacity', '0')
        }
        else if (catType == 'giaima') {
          $('#giaima').css('opacity', '1')
          $('#normal').css('opacity', '0')
          $('#tunghoanh').css('opacity', '0')
        }
        else if (catType == 'tunghoanh') {
          $('#tunghoanh').css('opacity', '1')
          $('#normal').css('opacity', '0')
          $('#giaima').css('opacity', '0')
        }
        $('#catText').text(category)
        $('#catContainer').animate({
          top: '0px'
        }, 500, 'swing')
        $('#uplight').animate({
          'opacity': 0, 'left': '1353px'
        }, 60000, 'linear')
        $('#downlight').animate({
          'opacity': 0, 'left': '393px'
        }, 60000, 'linear')
      }
    }

    function reveal(index, letter, state) {
      if (state == 0) {
        $('#letter' + index).removeClass('waitToOpen hasLetter')
      }
      else if (state == 1) {
        $('#letter' + index).removeClass('waitToOpen').addClass('hasLetter')
      }
      else if (state == 2) {
        $('#letter' + index).addClass('waitToOpen')
      }
      else if (state == 3) {
        $('#letter' + index).addClass('hasLetter').removeClass('waitToOpen');
        $('#letter' + index + ' p').text(letter);
      }
    }

    function revealPuzzle(puzzle) {
      //playShowPuzzleVid()
      let openSequence = [14, 28, 1, 15, 29, 43, 2, 16, 30, 44, 3, 17, 31, 45, 4, 18, 32, 46, 5, 19, 33, 47, 6, 20, 34, 48, 7, 21, 35, 49, 8, 22, 36, 50, 9, 23, 37, 51, 10, 24, 38, 52, 11, 25, 39, 53, 12, 26, 40, 54, 27, 41]
      let i = 0
      for (let j = 0; j < openSequence.length; j++) {
        if (puzzle[openSequence[j]] == '') {
          openSequence.splice(j, 1);
          j--;
        }
      }
      console.log(openSequence)
      let interval = setInterval(() => {
        if (puzzle[openSequence[i]] != '') {
          $('#letter' + openSequence[i]).addClass('hasLetter');
        }
        if (puzzle[openSequence[i]] == '?' || puzzle[openSequence[i]] == '-' || puzzle[openSequence[i]] == '!' || puzzle[openSequence[i]] == '.' || puzzle[openSequence[i]] == ',' || puzzle[openSequence[i]] == "&" || puzzle[openSequence[i]] == '/') {
          $('#letter' + openSequence[i]).addClass('hasLetter').removeClass('waitToOpen');
          $('#letter' + openSequence[i] + ' p').text(puzzle[openSequence[i]]);
        }
        else if (puzzle[openSequence[i]] == '#') {
          $('#letter' + openSequence[i]).removeClass('waitToOpen hasLetter').addClass('giaima');
        }
        i++
        if (i >= openSequence.length) clearInterval(interval)
      }, 75)
    }
    function revealPuzzleImmediate(puzzle) {
      for (let i = 0; i <= puzzle.length; i++) {
        if (puzzle[i] != '') {
          $('#letter' + i).addClass('hasLetter');
        }
        if (puzzle[i] == '?' || puzzle[i] == '-' || puzzle[i] == '!' || puzzle[i] == '.' || puzzle[i] == ',' || puzzle[i] == "&" || puzzle[i] == '/') {
          $('#letter' + i).addClass('hasLetter').removeClass('waitToOpen');
          $('#letter' + i + ' p').text(puzzle[i]);
        }
        else if (puzzle[i] == '#') {
          $('#letter' + i).removeClass('waitToOpen hasLetter').addClass('giaima');
        }
      }
    }

    function solvePuzzle(puzzle, puzzleAfterGiaima, mode) {
      //if (mode == 'normal') playSolvePuzzleVid()
      //else if (mode == 'tossup') playSolveTossupPuzzleVid()
      let openSequence = [14, 28, 1, 15, 29, 43, 2, 16, 30, 44, 3, 17, 31, 45, 4, 18, 32, 46, 5, 19, 33, 47, 6, 20, 34, 48, 7, 21, 35, 49, 8, 22, 36, 50, 9, 23, 37, 51, 10, 24, 38, 52, 11, 25, 39, 53, 12, 26, 40, 54, 27, 41]
      if (mode == 'giaima') puzzle = puzzleAfterGiaima
      for (let j = 0; j < openSequence.length; j++) {
        if (puzzle[openSequence[j]] == '') {
          openSequence.splice(j, 1);
          j--;
        }
      }
      let i = 0
      if (mode == 'lose') {
        let interval = setInterval(() => {
          $('#letter' + openSequence[i] + ' p').text(puzzle[openSequence[i]]);
          i++
          if (i >= openSequence.length) {
            clearInterval(interval)
            socket.emit('playSound', '../sounds/lose bonus.mp3')
          }
        }, 250)
      }
      else if (mode == 'win') {
        let interval = setInterval(() => {
          $('#letter' + openSequence[i] + ' p').text(puzzle[openSequence[i]]);
          i++
          if (i >= openSequence.length) clearInterval(interval)
        }, 10)
        $('#leftBonusArea').animate({
          left: '-1100px'
        }, 1500, 'swing', () => {
          $('#leftBonusArea span:nth-child(3)').text('')
          $('#leftBonusArea span:nth-child(4)').text('')
          $('#leftBonusArea span:nth-child(5)').text('')
          $('#leftBonusArea span:nth-child(6)').text('')
          $('#leftBonusArea span:nth-child(7)').text('')
        })
        $('#rightBonusArea').animate({
          left: '1920px'
        }, 1500, 'swing', () => {
          $('#rightBonusArea span:nth-child(2)').text('')
          $('#rightBonusArea span:nth-child(3)').text('')
          $('#rightBonusArea span:nth-child(4)').text('')
          $('#rightBonusArea span:nth-child(5)').text('')
          $('#rightBonusArea').css('opacity', 0)
        })
      }
      else if (mode == 'giaima') {
        let interval = setInterval(() => {
          $('#letter' + openSequence[i] + ' p').text(puzzle[openSequence[i]]);
          $('#letter' + openSequence[i]).addClass('hasLetter').removeClass('giaima');
          i++
          if (i >= openSequence.length) clearInterval(interval)
        }, 10)
      }
      else if (mode == 'immediate') {
        for (let i = 0; i < openSequence.length; i++) {
          $('#letter' + openSequence[i] + ' p').text(puzzle[openSequence[i]]);
          $('#letter' + openSequence[i]).addClass('hasLetter').removeClass('waitToOpen');
        }
      }
      else {
        let interval = setInterval(() => {
          $('#letter' + openSequence[i] + ' p').text(puzzle[openSequence[i]] == '#' ? '' : puzzle[openSequence[i]]);
          $('#letter' + openSequence[i]).addClass('hasLetter').removeClass('waitToOpen');
          i++
          if (i >= openSequence.length) clearInterval(interval)
        }, 10)
      }
    }

    socket.on('revealPuzzle', puzzle => revealPuzzle(puzzle))
