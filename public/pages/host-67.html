  <script>
    const socket = io();
    let totalScore1 = 0, totalScore2 = 0, totalScore3 = 0;
    $(() => {
      for (let i = 0; i <= 55; i++) {
        $('#puzzle').append('<div class="letter letter' + i + '">-</div>');
        $('#solvedPuzzle').append('<div class="letter letter' + i + '">-</div>');
      }
      for (let i = 1; i <= 11; i++) {
        $('tbody tr:nth-child(' + i + ') td:nth-child(2)').on('change', () => {
          totalScore1 = 0;
          for (let j = 1; j <= 11; j++) {
            totalScore1 += parseInt($('tbody tr:nth-child(' + j + ') td:nth-child(2) input').val()) || 0;
          }
          $('tbody tr:nth-child(12) td:nth-child(2)').text(totalScore1);
        })
        $('tbody tr:nth-child(' + i + ') td:nth-child(3)').on('change', () => {
          totalScore2 = 0;
          for (let j = 1; j <= 11; j++) {
            totalScore2 += parseInt($('tbody tr:nth-child(' + j + ') td:nth-child(3) input').val()) || 0;
          }
          $('tbody tr:nth-child(12) td:nth-child(3)').text(totalScore2);
        })
        $('tbody tr:nth-child(' + i + ') td:nth-child(4)').on('change', () => {
          totalScore3 = 0;
          for (let j = 1; j <= 11; j++) {
            totalScore3 += parseInt($('tbody tr:nth-child(' + j + ') td:nth-child(4) input').val()) || 0;
          }
          $('tbody tr:nth-child(12) td:nth-child(4)').text(totalScore3);
        })
      }
    })

    function formatMessageTime(timestamp) {
      const date = new Date(timestamp)
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
    }

    function appendMessage(message) {
      const messageElement = $('<div class="messageEntry"></div>')
      $('<span class="messageMeta"></span>').text(formatMessageTime(message.timestamp)).appendTo(messageElement)
      $("<div style='display:inline;margin-left:10px;'></div>").text(message.text).appendTo(messageElement)
      $('#messageHistory').append(messageElement)
      $('#messageHistory').scrollTop($('#messageHistory')[0].scrollHeight)
    }

    function sendMessage() {
      const messageInput = $('#messageInput')
      const text = messageInput.val().trim()
      if (!text) return
      socket.emit('chatMessage', 'Host: ' + text)
      messageInput.val('')
      messageInput.focus()
    }

    socket.on('messageHistory', messages => {
      $('#messageHistory').empty()
      messages.forEach(appendMessage)
    })

    socket.on('chatMessage', message => {
      appendMessage(message)
    })
    socket.on('systemLog', message => {
      appendMessage(message)
    })

    $('#sendMessageBtn').click(() => {
      sendMessage()
    })
    $('#messageInput').on('keydown', (e) => {
      if (e.key === 'Enter') {
        sendMessage()
      }
    })

    $('.guessedLetters').on('click', function () {
      $(this).toggleClass('active');
    });

    socket.on('hostPuzzle', (data) => {
      $('.guessedLetters').each(function () {
        $(this).removeClass('active');
      });
      $('#round').text(data.round + ': ' + data.question);
      $('#explanation').text(data.explain);
      $('#totalLetters').text('Σ: ' + Object.values(data.letterOccurence)[0]);
      $('.letters').each(function (index) {
        $(this).text(Object.values(data.letterOccurence)[index + 1]);
      });
      for (let i = 0; i < data.puzzle.length; i++) {
        if (data.solved[i]) {
          $('#puzzle .letter' + i).text(data.puzzle[i]);
          $('#solvedPuzzle .letter' + i).text(data.solved[i]);
        } else {
          $('#puzzle .letter' + i).text('');
          $('#solvedPuzzle .letter' + i).text('');
        }
      }
    })

    $('thead tr th:nth-child(2)').hover(() => {
      $('#wheelWeb').addClass('zoomedInP1')
    })
    $('thead tr th:nth-child(2)').mouseleave(() => {
      $('#wheelWeb').removeClass('zoomedInP1')
    })
    $('thead tr th:nth-child(3)').hover(() => {
      $('#wheelWeb').addClass('zoomedInP2')
    })
    $('thead tr th:nth-child(3)').mouseleave(() => {
      $('#wheelWeb').removeClass('zoomedInP2')
    })
    $('thead tr th:nth-child(4)').hover(() => {
      $('#wheelWeb').addClass('zoomedInP3')
    })
    $('thead tr th:nth-child(4)').mouseleave(() => {
      $('#wheelWeb').removeClass('zoomedInP3')
    })
  </script>
