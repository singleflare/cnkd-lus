<!DOCTYPE html>

<body>
  <style>
    body {
      background-color: black;
      aspect-ratio: 16/9;
      margin: 0;
      overflow: hidden;
    }

    * {
      font-size: 15pt;
      font-family: 'Arial';
    }

    span {
      color: white;
    }

    button {
      background-color: black;
      color: white;
      border: 1px solid white;
    }

    button:hover {
      background-color: white;
      color: black;
    }

    #controlLetters {
      position: relative;
      display: grid;
      grid-template-columns: repeat(14, 1fr);
      grid-template-rows: repeat(4, 1fr);
      width: 100%;
    }

    .letterBtn {
      height: 50px;
      font-size: 30pt;
    }

    .letterBtn:hover {
      background-color: white !important;
      color: black !important;
    }

    .letterBtn:disabled {
      opacity: 0.2;
    }

    .puzzleInput {
      display: grid;
      grid-template-columns: repeat(16, 1fr);
      grid-template-rows: repeat(4, 1fr);
      width: 0px;
      gap: 5px;
    }

    .letterInput {
      width: 25px;
      height: 50px;
      text-align: center;
    }

    .flexContainer {
      display: flex;
      flex-direction: row;
    }

    .flexContainer>* {
      width: 100%;
    }

    #scoreboard {
      display: inline-block;
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .column {
      position: absolute;
      width: 960px;
    }

    #prizeBoardR1>div,
    #prizeBoardR2>div {
      border: 1px solid white;
      border-collapse: collapse;
    }

    #wheelWeb {
      scale: 0.33
    }

    #wheelWeb.zoomedInP1 {
      scale: 1;
      transform: rotate(45deg);
      left: 80px;
      top: -660px;
    }

    #wheelWeb.zoomedInP2 {
      scale: 1;
      transform: rotate(0deg);
      left: -650px;
      top: -150px;
    }

    #wheelWeb.zoomedInP3 {
      scale: 1;
      transform: rotate(-45deg);
      left: -780px;
      top: 720px;
    }

    #individualLetters>* {
      font-size: 16pt
    }

    #messageHistory {
      height: 160px;
      overflow-y: auto;
      border: 1px solid white;
      padding: 8px;
      box-sizing: border-box;
      background: #050505;
      color: white;
      font-size: 12pt;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .messageEntry {
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 4px;
      word-break: break-word;
    }

    .messageMeta {
      color: #aaa;
      font-size: 10pt;
      margin-bottom: 2px;
    }

    #messageInputRow {
      display: flex;
      gap: 6px;
      align-items: stretch;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      background: black;
      color: white;
      border: 1px solid white;
      padding: 6px 8px;
      box-sizing: border-box;
    }

      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })

    function appendMessage(message) {
      const messageElement = $('<div class="messageEntry"></div>')
      $('<span class="messageMeta"></span>').text(formatMessageTime(message.timestamp)).appendTo(messageElement)
      $("<div style='display:inline;margin-left:10px;'></div>").text(message.text).appendTo(messageElement)
      $('#messageHistory').append(messageElement)
      $('#messageHistory').scrollTop($('#messageHistory')[0].scrollHeight)
    }

      const messageInput = $('#messageInput')

      messageInput.val('')
      messageInput.focus()
    }

    function shuffle(array) {
      let currentIndex = array.length;
      // While there remain elements to shuffle...
      while (currentIndex != 0) {
        // Pick a remaining element...
        let randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        // And swap it with the current element.
        [array[currentIndex], array[randomIndex]] = [
          array[randomIndex], array[currentIndex]];
      }
    }

        p1Score += score
        $('#p1Score').text(p1Score)
      }
      else if (player == 2) {
        p2Score += score
        $('#p2Score').text(p2Score)

      else if (player == 3) {
        p3Score += score
        $('#p3Score').text(p3Score)
      }
      else if (player == 'ks') {
        ksScore += score
        $('#ksScore').text(ksScore)
      }
    }
    function minus(player, score) {
      if (player == 1) {
        p1Score -= score
        $('#p1Score').text(p1Score)

        p2Score -= score
        $('#p2Score').text(p2Score)
      }
      else if (player == 3) {
        p3Score -= score
        $('#p3Score').text(p3Score)
      }
    }
    function double(player) {
      if (player == 1) {
        p1Score *= 2
        $('#p1Score').text(p1Score)
      }
      else if (player == 2) {
        p2Score *= 2
        $('#p2Score').text(p2Score)
      }
      else if (player == 3) {
        p3Score *= 2
        $('#p3Score').text(p3Score)
      }
    }
    function oneHalf(player) {
      if (player == 1) {
        p1Score *= 1.5
        $('#p1Score').text(p1Score)
      }
      else if (player == 2) {
        p2Score *= 1.5
        $('#p2Score').text(p2Score)
      }
      else if (player == 3) {
        p3Score *= 1.5
        $('#p3Score').text(p3Score)
      }
    }
    function half(player) {
      if (player == 1) {
        p1Score /= 2
        $('#p1Score').text(p1Score)
      }
      else if (player == 2) {
        p2Score /= 2
        $('#p2Score').text(p2Score)
      }
      else if (player == 3) {
        p3Score /= 2
        $('#p3Score').text(p3Score)
      }

    $('#randomizePassword').click(async () => {
      const generateRandomString = (length) => {
        const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        const charactersLength = characters.length;
        let result = '';
        const randomValues = new Uint32Array(length);
        window.crypto.getRandomValues(randomValues);
        randomValues.forEach((value) => {
          result += characters.charAt(value % charactersLength);
        });
        return result;
      };
      $('#passwordInput1').val(generateRandomString(3))
      $('#passwordInput2').val(generateRandomString(3))
      $('#passwordInput3').val(generateRandomString(3))
      const response = await fetch('/api/set-passwords', {
