<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay</title>
</head>

<body>
  <div id='todayScheduleContainer'>
    <span id='ovlTitle'>LỊCH TRÌNH HÔM NAY - DD.MM.YYYY</span>
    <span id='time1'>HH1:MM1</span>
    <span id='match1'>MATCH1</span>
    <span id='players1'>PLAYER1 - PLAYER2 - PLAYER3</span>
    <span id='time2'>HH2:MM2</span>
    <span id='match2'>MATCH2</span>
    <span id='players2'>PLAYER1 - PLAYER2 - PLAYER3</span>
  </div>
  <div id='comingUpContainer'>
    <span id='ovlTitle'>TIẾP THEO</span>
    <span id='time'>HH1:MM1</span>
    <span id='match'>MATCH1</span>
    <span id='players'>PLAYER1 - PLAYER2 - PLAYER3</span>
    <span id='timeRemaining'>MM:SS</span>
  </div>
  <div id='recapContainer'>
    <span id='ovlTitle'>VÒNG X</span>
    <span id='player1Name'>PLAYER1</span>
    <span id='player2Name'>PLAYER2</span>
    <span id='player3Name'>PLAYER3</span>
    <span id='player1Score'>SCORE1</span>
    <span id='player2Score'>SCORE2</span>
    <span id='player3Score'>SCORE3</span>
    <span id='timeRemaining'>MM:SS</span>
  </div>
  <div id='shotcallContainer'>
    <span id='ovlTitle'>SHOTCALL</span>
    <span id='question'>PLAYER1</span>
    <span id='player2Name'>PLAYER2</span>
    <span id='player3Name'>PLAYER3</span>
    <span id='player1Score'>SCORE1</span>
    <span id='player2Score'>SCORE2</span>
    <span id='player3Score'>SCORE3</span>
    <span id='timeRemaining'>MM:SS</span>
  </div>
</body>

</html>
